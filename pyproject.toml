[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "xunxian-questdb"
version = "0.1.0"
description = "Reproducible quest database builder for Xunxian resource tables"
requires-python = ">=3.11"

[dependency-groups]
dev = [
  "pytest>=8,<10",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
