[project]
name = "xunxian-quest-viewer"
version = "0.1.0"
description = "Local read-only web viewer for the Xunxian quest database"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.116,<1",
  "jinja2>=3.1,<4",
  "python-multipart>=0.0.20,<1",
  "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

